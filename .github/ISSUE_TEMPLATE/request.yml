name: Request
description: Request an extension, improvement, or clarification.
labels: [request]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Describe what you’re building or trying to do.
    validations:
      required: true
  - type: textarea
    id: request
    attributes:
      label: Request
      description: Describe the problem or missing capability and what would help. Include questions if you’re unsure what is supported.
    validations:
      required: true
  - type: textarea
    id: screenshots-video
    attributes:
      label: Screenshots / video
      description: Attach screenshots or a recording illustrating your request.
