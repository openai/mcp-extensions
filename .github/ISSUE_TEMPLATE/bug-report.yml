name: Bug report
description: Report a problem with MCP Extensions.
body:
  - type: checkboxes
    id: before-reporting
    attributes:
      label: Before reporting
      options:
        - label: I have checked that I am on the latest desktop or mobile build, where applicable.
          required: true
        - label: I am presenting my investigation and research in my own words.
          required: true
  - type: checkboxes
    id: environment
    attributes:
      label: Environment
      description: Where did you encounter the issue? Select all that apply.
      options:
        - label: Desktop
        - label: Web
        - label: iOS
        - label: Android
    validations:
      required: true
  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Provide numbered steps, including a minimal code example or MCP payload if relevant.
    validations:
      required: true
  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true
  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What happened instead? Include any error messages.
    validations:
      required: true
  - type: textarea
    id: screenshots-video
    attributes:
      label: Screenshots / video
      description: Attach screenshots or a recording showing the issue.
